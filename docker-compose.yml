services:
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional app stack (throwaway dev secrets only): docker compose --profile app up --build
  migrate:
    profiles: ["app"]
    build:
      context: .
      target: migrator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/whitelabel_dev

  api:
    profiles: ["app"]
    build:
      context: .
      target: runtime
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/whitelabel_dev
      DEPLOYMENT_MODE: shared
      JWT_SECRET: dev-only-jwt-secret-do-not-use-in-production-0123456789
    ports:
      - "${API_PORT:-3000}:3000"

volumes:
  pgdata:

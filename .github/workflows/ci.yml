name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    env:
      # Throwaway CI-only literals; the integration projects set their own DATABASE_URL.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/whitelabel_test_shared
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/whitelabel_shadow
      DEPLOYMENT_MODE: shared
      JWT_SECRET: ci-only-jwt-secret-not-a-real-secret-0123456789
      PGPASSWORD: postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma validate

      - name: Create databases
        run: |
          for db in whitelabel_test_shared whitelabel_test_dedicated whitelabel_shadow; do
            psql -h localhost -U postgres -c "CREATE DATABASE $db"
          done

      - name: Migrate test databases
        run: |
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/whitelabel_test_shared npx prisma migrate deploy
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/whitelabel_test_dedicated npx prisma migrate deploy

      - name: Migrations match schema
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

      - run: npm run test:unit
      - run: npm run test:int:shared
      - run: npm run test:int:dedicated

      - name: OpenAPI contract is up to date
        run: npm run openapi:generate && git diff --exit-code openapi/

      # Compares this PR's contract with the one on the branch it merges into. The base copy is
      # written into the workspace (git-ignored) because the oasdiff container only mounts it.
      - name: Base branch OpenAPI contract
        id: base-spec
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/base-openapi.sh "origin/$BASE_REF" .oasdiff-base.json

      - name: No breaking API changes
        if: github.event_name == 'pull_request' && steps.base-spec.outputs.skip != 'true'
        run: scripts/check-breaking.sh .oasdiff-base.json openapi/openapi.json

      # The starter itself never serves routes under /api/v1/x/ (that namespace belongs to app
      # backends, so the namespace unit test allows it). App backends inherit this step, but it
      # only runs in the starter repo.
      - name: Starter defines no app-namespace routes
        if: github.repository == 'zakaria-hajja/white-label-server'
        run: |
          if [ -n "$(git ls-files 'src/app/api/v1/x/')" ]; then
            echo "::error::the starter must not define routes under src/app/api/v1/x/ (see docs/contract.md)"
            git ls-files 'src/app/api/v1/x/'
            exit 1
          fi

      - run: npm run openapi:lint
      - run: npm run build

      - name: Commit messages
        if: always() && github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/check-commit-messages.sh "$BASE" "$HEAD"
